<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >
        <meta name="color-scheme" content="light dark">

        <title>MMV4 Bonus Code Generator</title>
    </head>

    <body>
        <main class="container">
            <h1>Micro Machines V4</h1>
            <p>Bonus code generator for PC and PlayStation 2.</p>

            <figure class="hero">
                <img
                    src="/assets/micromachinev4.jpg"
                    alt="Micro Machines V4 cars racing across a workshop"
                >
            </figure>

            <article>
                <p class="instructions">
                    In the game, open <strong>Profile &gt; Bonus</strong>, then enter your profile access code below.
                </p>

                <label for="platform">
                    Platform
                    <select id="platform">
                        <option value="pc">PC</option>
                        <option value="ps2">PlayStation 2</option>
                    </select>
                </label>

                <label for="profile-id">
                    Profile access code
                    <input id="profile-id" type="number" min="0" max="65535" required>
                </label>

                <button id="generate" type="button">
                    Generate all bonus codes
                </button>

                <hr>

                <table>
                    <thead>
                        <tr>
                            <th scope="col">Bonus</th>
                            <th scope="col">Generated code</th>
                        </tr>
                    </thead>
                    <tbody id="results" aria-live="polite"></tbody>
                </table>

                <p id="error" role="alert" hidden></p>
            </article>
        </main>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
