<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >
        <meta name="color-scheme" content="light dark">

        <title>MMV4 Bonus Code Generator</title>
    </head>

    <body>
        <main class="container">
            <header class="page-header">
                <div>
                    <h1>Micro Machines V4</h1>
                    <p>Bonus code generator for PC and PlayStation 2.</p>
                </div>

                <button id="theme-toggle" class="outline secondary theme-toggle" type="button"
                        aria-label="Switch to dark theme">
                    <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20.4 15.3A8.5 8.5 0 0 1 8.7 3.6 8.5 8.5 0 1 0 20.4 15.3Z"></path>
                    </svg>
                    <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
                    </svg>
                </button>
            </header>

            <figure class="hero">
                <img
                    src="/assets/micromachinev4.jpg"
                    alt="Micro Machines V4 cars racing across a workshop"
                >
            </figure>

            <article>
                <p class="instructions">
                    In the game, open <strong>Profile &gt; Bonus</strong>, then enter your profile access code below.
                </p>

                <label for="platform">
                    Platform
                    <select id="platform">
                        <option value="pc">PC</option>
                        <option value="ps2">PlayStation 2</option>
                    </select>
                </label>

                <label for="profile-id">
                    Profile access code
                    <input id="profile-id" type="number" min="0" max="65535" required>
                </label>

                <button id="generate" type="button">
                    Generate all bonus codes
                </button>

                <hr>

                <table>
                    <thead>
                        <tr>
                            <th scope="col">Bonus</th>
                            <th scope="col">Generated code</th>
                        </tr>
                    </thead>
                    <tbody id="results" aria-live="polite"></tbody>
                </table>

                <p id="error" role="alert" hidden></p>
            </article>
        </main>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
